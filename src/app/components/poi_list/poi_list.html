@if (pois().length > 0) {
  <mat-list>
    @for (poi of pois(); track poi.name) {
      <mat-list-item>
        <mat-icon matListItemIcon>{{ getIcon(poi.types) }}</mat-icon>
        <div matListItemTitle>{{ poi.name }}</div>
        <div matListItemLine>{{ poi.vicinity }}</div>
        <div matListItemLine class="position-tag">{{ getRelativePosition(poi) }}</div>
      </mat-list-item>
    }
  </mat-list>
} @else {
  <p class="empty-message">No points of interest detected nearby.</p>
}
