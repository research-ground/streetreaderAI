<div>
  <mat-card-title>Adjacent Panoramas</mat-card-title>
</div>
<mat-list>
  @for (link of links(); track link.canonicalNodeId) {
    <mat-list-item>
      <div>
        <div>Lat: {{ link.coordinates.latitude.toFixed(5) }}</div>
        <div>Lng: {{ link.coordinates.longitude.toFixed(5) }}</div>
        <div *ngIf="link.status === 'path_only'" style="font-style: italic; color: #b26a00;">Path exists — no imagery yet</div>
      </div>
      <span style="flex: 1 1 auto;"></span>
      <span>Heading: {{ stateService.formatHeadingValue(link.heading) }}</span>
    </mat-list-item>
  } @empty {
    <p>No adjacent links found.</p>
  }
</mat-list>
